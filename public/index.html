<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Metrics Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- jsPDF for PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar" id="navbar">
  <span class="navbar-logo" onclick="navigate('#/')">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#7c3aed"/>
          <stop offset="100%" style="stop-color:#e040fb"/>
        </linearGradient>
      </defs>
      <path d="M9 18V5l12-2v13" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="6" cy="18" r="3" stroke="url(#logoGrad)" stroke-width="2"/>
      <circle cx="18" cy="16" r="3" stroke="url(#logoGrad)" stroke-width="2"/>
    </svg>
    Artist Metrics
  </span>

  <span class="navbar-spacer"></span>

  <div class="navbar-actions" id="navbar-actions"></div>
</nav>

<!-- Main app container -->
<main class="main">
  <div id="app">
    <div class="loading-overlay">
      <div class="spinner"></div>
      <span>Cargando...</span>
    </div>
  </div>
</main>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Hidden canvas for PDF generation -->
<canvas id="pdf-canvas" style="display:none; position:absolute; left:-9999px;"></canvas>

<script src="/app.js"></script>
</body>
</html>
